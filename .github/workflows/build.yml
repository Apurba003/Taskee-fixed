name: Build Taskee

on:
  push:
  pull_request:
  workflow_dispatch:

# Every step that can fail writes its log to a file and passes it through
# tool/annotate_ci.py, so errors show up as annotations in the run.
jobs:
  test:
    name: Analyze & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Taskee
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (informational)
        continue-on-error: true
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.log 2>&1
          code=$?
          python3 tool/annotate_ci.py analyze.log Taskee/
          tail -n 30 analyze.log
          exit $code

      - name: Unit tests
        run: |
          set +e
          flutter test --reporter expanded > test.log 2>&1
          code=$?
          python3 tool/annotate_ci.py test.log Taskee/
          tail -n 40 test.log
          exit $code

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Taskee
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          set +e
          flutter build apk --release > build.log 2>&1
          code=$?
          python3 tool/annotate_ci.py build.log Taskee/
          tail -n 30 build.log
          exit $code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taskee-android-apk
          path: Taskee/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Taskee
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app without code signing
        run: |
          set +e
          flutter build ios --release --no-codesign > build.log 2>&1
          code=$?
          python3 tool/annotate_ci.py build.log Taskee/
          tail -n 30 build.log
          exit $code

      - name: Package unsigned IPA
        run: |
          rm -rf Payload Taskee-unsigned.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Taskee-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: taskee-ios-unsigned-ipa
          path: Taskee/Taskee-unsigned.ipa
          if-no-files-found: error
